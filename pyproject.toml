[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "non_local_detector"
description = "A python package to decode non-local activity from neural data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["neuroscience", "bayesian-inference", "hmm", "neural-decoding", "replay-detection"]
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
maintainers = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy >=1.25",
    "scipy >=1.10",
    "jax >=0.6.2",
    "pandas >=2.0",
    "networkx >=3.0",
    "xarray >=2024.5",
    "scikit-learn >=1.3",
    "threadpoolctl >=3.0",
    "patsy >=0.5.2",
    "tqdm >=4.60",
    "track_linearization >=2.4.0",
    "matplotlib >=3.7",
    "seaborn >=0.12",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/LorenFrankLab/non_local_detector"
"Bug Tracker" = "https://github.com/LorenFrankLab/non_local_detector/issues"
"Source" = "https://github.com/LorenFrankLab/non_local_detector"
"Changelog" = "https://github.com/LorenFrankLab/non_local_detector/releases"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "hypothesis",
    # Benchmark scripts record memory with psutil; their smoke test runs in CI.
    "psutil",
]
dev = [
    "non_local_detector[test]",
    "ruff",
    "mypy",
    "ipython",
    "pre-commit",
]
gpu = ["jax[cuda]"]
viz = ["sortingview"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/non_local_detector/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".git_archival.txt",
    "/docs/performance_artifacts/**",
    "/.claude/docs/gmm-background-diagnosis/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/non_local_detector"]

# Ruff configuration
[tool.ruff]
line-length = 88
# Exploratory notebooks are not run in CI and carry stale cells; .claude holds
# planning notes and throwaway evidence scripts.
extend-exclude = ["notebooks", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "FA",   # flake8-future-annotations
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
    "ARG",  # unused arguments
    "EM",   # exception messages assigned before the raise
    "EXE",  # shebangs
    "FURB", # refurb modernizations
    "G",    # logging format
    "ICN",  # import conventions
    "ISC",  # implicit string concatenation
    "PERF", # performance anti-patterns
    "PGH",  # pygrep hooks (blanket noqa, type: ignore without code)
    "PIE",  # misc lints
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return statements
    "SIM",  # simplifications
    "T20",  # print statements
    "YTT",  # sys.version misuse
]
ignore = [
    "E501",    # line too long, handled by ruff format
    "ISC001",  # conflicts with the formatter
    "B008",    # do not perform function calls in argument defaults
]
# Math notation in docstrings, comments and messages.
allowed-confusables = ["×", "σ", "α", "γ", "∪"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = [
    "ARG",   # pytest fixtures are used by name, not by value
    "B011",
]
"{scripts,benchmarks}/**" = ["T201"]  # scripts report to stdout

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["src/non_local_detector/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-config",
    "--strict-markers",
    "--durations=10",
    "-ra",
]
xfail_strict = true
log_level = "INFO"
# Per-test limit from pytest-timeout (in the test extra), locally and in CI.
timeout = 900

# Test markers for selective running
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "property: marks property-based tests",
    "snapshot: marks snapshot regression tests (update with --snapshot-update)",
]

[tool.codespell]
skip = "uv.lock,*.ipynb,*.pkl,*.npz,*.png,*.svg"
# Patsy's te() tensor-product term, n-dimensional (einsum "nd"), S-hat (Shat),
# and the "*afe*" glob in a plan's shell example.
ignore-words-list = "afe,nd,shat,te"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
