# The package floors below mirror pyproject.toml; tests/test_conda_environment_files.py
# fails when they drift apart.
name: non_local_detector_gpu
channels:
- conda-forge
- nvidia
- franklab
- edeno
dependencies:
- python >=3.10
- numpy >=2.2
- scipy >=1.15
- jaxlib=*=*cuda*
- jax >=0.6.2
- pandas >=2.3
- cuda-nvcc
- networkx >=3.4
- xarray >=2024.11
- scikit-learn >=1.6
- threadpoolctl >=3.0
- patsy >=0.5.6
- tqdm >=4.60
- track_linearization >=2.4.0
- matplotlib >=3.10
# Test and development tools (the pyproject.toml test and dev dependency groups).
- pytest
- pytest-cov
- pytest-timeout
- psutil
- netcdf4
- ruff
- mypy
- ipython
- ipykernel
- pre-commit
