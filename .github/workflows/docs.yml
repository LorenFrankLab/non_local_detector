name: Documentation

on:
  push:
    branches:
      - main
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

permissions:
  contents: read

# Cancel superseded pull-request builds; let main deployments finish in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --group docs
      # --strict fails on broken nav, broken relative links and docstring
      # parameters that do not match the signature.
      # Also runs every tutorial (mkdocs-jupyter); a failing cell fails the build.
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
      # A project site is served under /non_local_detector/, so map that path
      # onto the built site for the link checker.
      - name: Prepare link-check root
        run: rm -rf _lc && mkdir -p _lc && ln -s ../site _lc/non_local_detector
      # In-page anchors in the hand-written pages; --offline skips external
      # URLs so the check never flakes. The generated API pages are not a
      # crawl source, but links into them are checked.
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --index-files index.html
            --root-dir _lc
            --exclude-path site/api
            './site/**/*.html'
          fail: true
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
