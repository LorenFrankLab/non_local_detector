name: Test, Build, and Publish

on:
  push:
    branches:
      - main
      - maint/*
    tags:
      - "v*"
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  # Weekly run so a new release of a dependency surfaces even without a push.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# A newer push to a pull request cancels its superseded run. Every other run
# (a push to main, maint/* or a tag, the weekly schedule, a manual dispatch)
# gets a group of its own: GitHub keeps only one pending run per group and
# cancels the older one when another queues, so a shared group would drop
# CI for some merged commits even without cancel-in-progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  UV_VERSION: "0.13.5"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      # --locked fails if uv.lock is out of date with pyproject.toml, and pins
      # ruff to the version pre-commit uses. The `dev` dependency group is
      # synced by default.
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run ruff linting
        run: uv run --no-sync ruff check src/ tests/ --output-format=github
      - name: Run ruff formatting check
        run: uv run --no-sync ruff format --check src/ tests/
      # Strict, over the package without its tests ([tool.mypy] in pyproject).
      - name: Run mypy
        run: uv run --no-sync mypy
      - name: Lint the workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: regular
          # Report as annotations; uploading to code scanning would need
          # security-events: write.
          advanced-security: false
          annotations: true

  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true
          # One macOS job, to catch platform-specific failures.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      # The versions developers test against locally. On Python 3.10 the lock
      # resolves JAX 0.6.2, the minimum supported release.
      - name: Install locked dependencies
        run: uv sync --locked --no-dev --group test
      # Persistent JAX compilation cache (tests/conftest.py): cuts a heavy
      # test file from ~3 min to ~1 min. Restored on every run except a tag
      # push, which publishes to PyPI and so never restores a cache; saved only
      # by runs on main, so a pull request cannot write an entry that main or a
      # release would read. One entry per job per ISO week, keyed on OS,
      # architecture, Python and the installed packages, so no job reads
      # another's compiled programs: the first main run of the week (or after
      # a dependency change) saves it, later runs restore it and save nothing,
      # and the weekly rotation drops entries for changed tests.
      - name: Compute the JAX cache key
        id: jax-cache-key
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python_version="$(uv run --no-sync python -VV)"
          packages="$(uv pip freeze)"
          if [ -z "$packages" ]; then
            echo "::error::uv pip freeze listed no packages"
            exit 1
          fi
          hash="$(printf '%s\n%s\n' "$python_version" "$packages" | shasum -a 256 | cut -c1-16)"
          week="$(date -u +%G-W%V)"
          echo "key=jax-test-${PYTHON_VERSION}-${RUNNER_OS}-${RUNNER_ARCH}-${week}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore the JAX compilation cache
        id: jax-cache-restore
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jax-compilation
          key: ${{ steps.jax-cache-key.outputs.key }}
      - name: Run tests
        run: >-
          uv run --no-sync pytest
          ${{ matrix.coverage && '--cov=non_local_detector --cov-report=xml' || '' }}
      - name: Save the JAX compilation cache
        if: >-
          success() && github.ref == 'refs/heads/main'
          && steps.jax-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jax-compilation
          key: ${{ steps.jax-cache-key.outputs.key }}
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-lowest:
    name: Test lowest supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"
          activate-environment: true
      # Every runtime dependency at the floor declared in pyproject.toml; the
      # test tools have no floors, so they install at their newest versions.
      - name: Install lowest runtime dependencies
        run: |
          uv pip install --resolution lowest-direct -e .
          uv pip install --group test
          uv pip list
      # JAX compilation cache; see the test job for how it is keyed and saved.
      - name: Compute the JAX cache key
        id: jax-cache-key
        run: |
          set -euo pipefail
          python_version="$(uv run --no-sync python -VV)"
          packages="$(uv pip freeze)"
          if [ -z "$packages" ]; then
            echo "::error::uv pip freeze listed no packages"
            exit 1
          fi
          hash="$(printf '%s\n%s\n' "$python_version" "$packages" | shasum -a 256 | cut -c1-16)"
          week="$(date -u +%G-W%V)"
          echo "key=jax-lowest-${RUNNER_OS}-${RUNNER_ARCH}-${week}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore the JAX compilation cache
        id: jax-cache-restore
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jax-compilation
          key: ${{ steps.jax-cache-key.outputs.key }}
      - name: Run tests
        run: pytest
      - name: Save the JAX compilation cache
        if: >-
          success() && github.ref == 'refs/heads/main'
          && steps.jax-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jax-compilation
          key: ${{ steps.jax-cache-key.outputs.key }}

  test-latest:
    name: Test latest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      # Ignore uv.lock and resolve the newest releases, so an upstream change
      # shows up here before the lock is updated.
      - name: Install latest dependencies
        run: |
          uv sync --upgrade --no-dev --group test
          uv pip list
      # JAX compilation cache; see the test job for how it is keyed and saved.
      - name: Compute the JAX cache key
        id: jax-cache-key
        run: |
          set -euo pipefail
          python_version="$(uv run --no-sync python -VV)"
          packages="$(uv pip freeze)"
          if [ -z "$packages" ]; then
            echo "::error::uv pip freeze listed no packages"
            exit 1
          fi
          hash="$(printf '%s\n%s\n' "$python_version" "$packages" | shasum -a 256 | cut -c1-16)"
          week="$(date -u +%G-W%V)"
          echo "key=jax-latest-${RUNNER_OS}-${RUNNER_ARCH}-${week}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore the JAX compilation cache
        id: jax-cache-restore
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jax-compilation
          key: ${{ steps.jax-cache-key.outputs.key }}
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Save the JAX compilation cache
        if: >-
          success() && github.ref == 'refs/heads/main'
          && steps.jax-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jax-compilation
          key: ${{ steps.jax-cache-key.outputs.key }}

  build:
    runs-on: ubuntu-latest
    needs: [quality, test, test-lowest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from git history and tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - run: uvx twine check --strict dist/*
      - name: Upload sdist and wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
      - name: Build git archive
        run: mkdir archive && git archive -v -o archive/archive.tgz HEAD
      - name: Upload git archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: archive
          path: archive/

  # Install each artifact the way a user would and run the smoke tests
  # against that installation. The code itself is tested by the jobs above.
  test-package:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ['wheel', 'sdist', 'archive']
    steps:
      # The sdist carries the tests the wheel and sdist runs use.
      - name: Download sdist and wheel artifacts
        if: matrix.package != 'archive'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Download git archive artifact
        if: matrix.package == 'archive'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: archive
          path: archive/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          # No `cache: pip` here: this job deliberately has no source
          # checkout (it installs the package from a built artifact to
          # verify it works standalone). Enabling the pip cache makes
          # setup-python look for requirements.txt / pyproject.toml in
          # the empty workspace and fail immediately with "No file
          # matched". The time cost of skipping the cache on a job that
          # does a handful of pip installs is negligible.
      - name: Install wheel
        if: matrix.package == 'wheel'
        run: pip install dist/*.whl
      - name: Install sdist
        if: matrix.package == 'sdist'
        run: pip install dist/*.tar.gz
      - name: Install archive
        if: matrix.package == 'archive'
        run: pip install archive/archive.tgz
      - name: Unpack the tests
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir source
          if [ "$PACKAGE" = archive ]; then
            tar -xzf archive/archive.tgz -C source
          else
            tar -xzf dist/*.tar.gz -C source --strip-components=1
          fi
      # `pip install --group` reads pyproject.toml in the working directory,
      # and needs pip 25.1 or newer.
      - name: Install test dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install --group test
      # The package lives in source/src, off sys.path, so the tests import
      # the installed copy; check that before trusting the result.
      - name: Check the tests import the installed package
        working-directory: source
        run: >-
          python -c "import non_local_detector, sys;
          sys.exit('site-packages' not in non_local_detector.__file__)"
      # The golden regression tests run every decoder end to end against the
      # installed package.
      - name: Run installed-package smoke tests
        working-directory: source
        run: >-
          pytest -p no:cacheprovider
          tests/test_golden_regression.py

  publish:
    runs-on: ubuntu-latest
    needs: [test-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    # The trusted publisher registered on PyPI names this workflow file and
    # environment; renaming either breaks publishing.
    environment:
      name: pypi
      url: https://pypi.org/project/non-local-detector/
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC) and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
